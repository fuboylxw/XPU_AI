<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI聊天界面</title>
  <link rel="stylesheet" href="styles.css">
  <!-- 引入Markdown渲染库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 引入代码高亮库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css" integrity="sha512-0aPQyyeZrWj9QzDDaRy2vsv7QZFZuuKCJPbmvwsRSKVAEVJI6J5DUHCr8AuSKfYNGFZIHxX8LnvK9pTQZ6kJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js" integrity="sha512-rdhY3cbXURo13l/WU9VlaRyaIYeJ/KBakckXIvJNAQde8DgpOmE+eZf7ha4vgqbm7LPHtJl/LTZREhTTIjYkXg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div class="app-container">
    <!-- 左侧历史对话面板 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-button" class="new-chat-btn">+ 新对话</button>
      </div>
      <div class="chat-history" id="chat-history">
        <!-- 历史对话列表将在这里动态添加 -->
      </div>
    </div>
    
    <!-- 右侧主聊天区域 -->
    <div class="main-content">
      <div class="chat-container">
        <div class="chat-header">
          <h1>AI Chat Agent</h1>
        </div>
        <div class="chat-messages" id="chat-messages">
          <!-- 消息将在这里动态添加 -->
        </div>
        <div class="chat-input-container">
          <textarea id="user-input" placeholder="输入消息..." rows="3"></textarea>
          <button id="send-button">发送</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
