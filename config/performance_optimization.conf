# 性能优化配置
# 这个文件包含了所有性能优化的配置参数

[concurrency]
# 并发配置
max_concurrent_tasks = 10
async_timeout = 30.0
executor_max_workers = 20

[cache]
# 缓存配置
# 内存缓存TTL（秒）
memory_cache_ttl = 300
# 内存缓存最大条目数
memory_cache_max_size = 1000

# Redis缓存TTL（秒）
security_audit_cache_ttl = 60
intent_recognition_cache_ttl = 120
conversation_context_cache_ttl = 1800
conversation_cache_ttl = 3600
mcp_tools_cache_ttl = 600

# 缓存预热配置
warmup_enabled = true
warmup_test_questions = ["你好", "今天天气怎么样？", "请介绍一下人工智能"]

[performance]
# 性能监控
enable_performance_monitoring = true
performance_stats_interval = 60
slow_query_threshold = 3.0

# 响应时间目标（秒）
target_response_time = 2.0
max_acceptable_response_time = 5.0

[cleanup]
# 清理配置
cache_cleanup_interval_hours = 2
expired_cache_cleanup_batch_size = 1000

# 日志配置
log_slow_queries = true
log_cache_operations = false
log_performance_stats = true

[optimization]
# 优化开关
enable_concurrent_processing = true
enable_redis_cache = true
enable_memory_cache = true
enable_cache_warmup = true
enable_response_compression = true

# 数据库优化
db_connection_pool_size = 20
db_connection_pool_max_overflow = 30
db_connection_timeout = 10.0

# 网络优化
http_connection_pool_size = 100
http_connection_timeout = 30.0
http_request_retry_count = 3