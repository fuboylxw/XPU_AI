# 测试环境配置
# 用于单元测试和集成测试的配置

debug: false

api:
  debug: false
  reload: false
  host: "202.200.206.248"
  port: 8001  # 使用不同端口避免冲突
  workers: 1

logging:
  level: "WARNING"  # 测试时减少日志输出
  console_enabled: false
  file_enabled: false  # 测试时不写入日志文件

security:
  # 测试环境使用固定的密钥
  secret_key: "test-secret-key-for-testing-only-32-chars"
  rate_limit_per_minute: 1000  # 测试时放宽限流
  rate_limit_per_hour: 10000
  csrf_enabled: false  # 测试时禁用CSRF

database:
  type: "sqlite"
  database: ":memory:"  # 使用内存数据库进行测试
  echo: false

redis:
  # 测试时使用不同的Redis数据库
  db: 15

ai:
  # 测试环境可以使用模拟的API密钥
  deepseek_api_key: "test-api-key"
  deepseek_temperature: 0.1  # 测试时使用确定性输出
  deepseek_max_tokens: 100

search:
  enabled: false  # 测试时禁用外部搜索
  timeout: 5
  cache_enabled: false

file:
  upload_dir: "tests/temp/uploads"
  documents_dir: "tests/temp/documents"
  vector_db_dir: "tests/temp/vector_db"
  max_file_size: 1048576  # 1MB限制

mcp:
  enabled: false  # 测试时禁用MCP服务
  server_port: 3001