# 生产环境配置
# 生产环境的安全和性能优化设置

debug: false

api:
  debug: false
  reload: false
  host: "0.0.0.0"
  port: 8000
  workers: 4  # 生产环境使用多个工作进程
  
  # 生产环境CORS设置更严格
  cors_origins:
    - "https://yourdomain.com"
    - "https://www.yourdomain.com"
  
  # 更严格的请求限制
  max_request_size: 8388608  # 8MB
  request_timeout: 15

logging:
  level: "INFO"
  console_enabled: false  # 生产环境不输出到控制台
  file_enabled: true
  file_path: "logs/production.log"
  file_max_size: "50MB"
  file_backup_count: 10

security:
  # 生产环境严格的安全设置
  rate_limit_per_minute: 30
  rate_limit_per_hour: 500
  burst_limit: 5
  csrf_enabled: true
  
  # 生产环境需要配置真实的API密钥
  api_keys:
    - "prod-api-key-1"
    - "prod-api-key-2"

database:
  type: "postgresql"  # 生产环境推荐使用PostgreSQL
  host: "202.200.206.248"
  port: 5432
  database: "xpu_ai_prod"
  pool_size: 20
  max_overflow: 30
  echo: false

redis:
  host: "202.200.206.248"
  port: 6379
  db: 0
  max_connections: 50

ai:
  deepseek_temperature: 0.5  # 生产环境使用更保守的温度
  deepseek_max_tokens: 1500

search:
  timeout: 20  # 生产环境较短的超时时间
  max_results: 3
  cache_ttl: 7200  # 2小时缓存

file:
  max_file_size: 5242880  # 5MB限制